# Parte común de los server de la landing (la incluye cada server con
# `include /etc/nginx/snippets/sidt-landing-comun.conf;`). El `root` lo define cada server.

index index.html;
charset utf-8;

# Cabeceras de seguridad básicas. Ningún location de abajo usa add_header, así que se heredan en todos.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml image/x-icon application/manifest+json;

# HTML y archivos de SEO: siempre se revalidan (`expires -1` = Cache-Control: no-cache).
location = / { try_files /index.html =404; expires -1; }
location = /gracias.html { try_files /gracias.html =404; expires -1; }
location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ { try_files $uri =404; expires 1h; }

# Archivos con hash: caché larga.
location /_astro/ { try_files $uri =404; expires 1y; }
# Medios (incluido el video): caché larga. nginx atiende "Range" de forma nativa (el video avanza y retrocede).
location /media/ { try_files $uri =404; expires 30d; }
# Favicons, manifest e imagen para compartir (llevan ?v=3 para renovarse).
location ~ ^/(favicon\.ico|favicon-\d+\.png|apple-touch-icon\.png|og-sidt\.jpg)$ { try_files $uri =404; expires 30d; }
location = /site.webmanifest { default_type application/manifest+json; try_files $uri =404; expires 30d; }

# Contenido administrable (direcciones, WhatsApp, testimonios): lo sirve la API, con caché en nginx.
# Es lo ÚNICO de la API que se expone aquí; el resto (/auth, /users...) no existe en estos dominios.
location /public/landing/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:3030;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";          # nunca viaja una sesión del portal a esta ruta pública
    proxy_cache landing;
    proxy_cache_key $scheme$proxy_host$uri;
    proxy_cache_valid 200 5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}

# Todo lo demás: 404 (sin listado de carpetas ni proxy a la API).
location / { return 404; }
