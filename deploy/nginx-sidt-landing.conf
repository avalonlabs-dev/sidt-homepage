# Landings de SIDT: asesoriasidt.com (+ www), lsec y ls.
#
# Instalación (detalle en docs/deploy-landing.md):
#   sudo cp deploy/nginx-sidt-landing-comun.conf /etc/nginx/snippets/sidt-landing-comun.conf
#   sudo cp deploy/nginx-sidt-landing.conf       /etc/nginx/sites-available/sidt-landing.conf
#   sudo ln -s /etc/nginx/sites-available/sidt-landing.conf /etc/nginx/sites-enabled/
#
# Los certificados no existen hasta correr certbot, y nginx no arranca con un server 443 sin su
# certificado. Por eso el archivo va por etapas, separadas por líneas "#@@ HTTPS-...":
#   Etapa 1 (solo HTTP, para pedir certificados):  sed '/^#@@ HTTPS-/,$d' deploy/nginx-sidt-landing.conf
#   Etapa 2 (+ HTTPS de la raíz y www):            sed '/^#@@ HTTPS-LS/,$d' deploy/nginx-sidt-landing.conf
#   Etapa 3 (completo, cuando ls y lsec ya tienen DNS y certificado): el archivo tal cual.

# Caché del proxy de /public/landing/ (a nivel http; este archivo se incluye dentro de http).
proxy_cache_path /var/cache/nginx/landing levels=1:2 keys_zone=landing:5m max_size=50m inactive=1h;

# ---------- HTTP: validación de certbot y redirección a HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name asesoriasidt.com www.asesoriasidt.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/sidt-landing/acme; }
    location / { return 301 https://asesoriasidt.com$request_uri; }
}
server {
    listen 80;
    listen [::]:80;
    server_name lsec.asesoriasidt.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/sidt-landing/acme; }
    location / { return 301 https://lsec.asesoriasidt.com$request_uri; }
}
server {
    listen 80;
    listen [::]:80;
    server_name ls.asesoriasidt.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/sidt-landing/acme; }
    location / { return 301 https://ls.asesoriasidt.com$request_uri; }
}

#@@ HTTPS-RAIZ ------------------------------------------------------------------------------
# Raíz: landing de Ecuador (es la versión por defecto y la canónica).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asesoriasidt.com;
    ssl_certificate     /etc/letsencrypt/live/asesoriasidt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asesoriasidt.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/sidt-landing/current/ec;
    include /etc/nginx/snippets/sidt-landing-comun.conf;
}
# www redirige a la raíz.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.asesoriasidt.com;
    ssl_certificate     /etc/letsencrypt/live/asesoriasidt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asesoriasidt.com/privkey.pem;
    return 301 https://asesoriasidt.com$request_uri;
}

#@@ HTTPS-LS --------------------------------------------------------------------------------
# lsec: destino de los anuncios de Ecuador; sirve el mismo build de Ecuador y declara la raíz como canónica.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lsec.asesoriasidt.com;
    ssl_certificate     /etc/letsencrypt/live/lsec.asesoriasidt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lsec.asesoriasidt.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/sidt-landing/current/ec;
    include /etc/nginx/snippets/sidt-landing-comun.conf;
}
# ls: landing de Perú.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ls.asesoriasidt.com;
    ssl_certificate     /etc/letsencrypt/live/ls.asesoriasidt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ls.asesoriasidt.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/sidt-landing/current/pe;
    include /etc/nginx/snippets/sidt-landing-comun.conf;
}
